# 系统级 nginx 站点：network-agent.test.chatgqt.top
# 由 bootstrap.sh 软链为 /etc/nginx/sites-enabled/network-agent；
# 证书由 certbot（Let's Encrypt）签发，续期 deploy hook 会 nginx -t + reload。
#
# 上游（只监听 127.0.0.1）：
#   8081 web 容器（SPA 静态托管）
#   8082 api 容器（FastAPI）
#   8083 agent 容器（LangGraph Server，SSE / WebSocket）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name network-agent.test.chatgqt.top;

    # 保留 ACME challenge 路径，证书续期/首次签发都可用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name network-agent.test.chatgqt.top;

    ssl_certificate /etc/letsencrypt/live/network-agent.test.chatgqt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/network-agent.test.chatgqt.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    server_tokens off;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 不能写成 /.well-known/*：会抢走 ACME http-01 挑战
    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- LangGraph Server ----
    # 前端请求 /agent/threads/...，去掉 /agent 前缀后转给 8083。
    location = /agent {
        return 308 /agent/;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 流式输出不能被 nginx 缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---- SPA ----
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/network-agent.access.log;
    error_log /var/log/nginx/network-agent.error.log;
}
