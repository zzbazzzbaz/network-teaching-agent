[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.1",
    "pyjwt[crypto]>=2.10.1",
    "bcrypt>=4.2.1",
    "e2b~=2.52.0",
    "cos-python-sdk-v5>=1.9.30",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
include = [
    "api",
    "api.*",
    "core",
    "core.*",
    "models",
    "models.*",
    "repositories",
    "repositories.*",
    "services",
    "services.*",
    "gateway",
    "gateway.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = ["E", "F", "I", "UP", "B", "ANN", "PYI", "PGH003"]
lint.ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.10",
    "ty==0.0.84",
]
