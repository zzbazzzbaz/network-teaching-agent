[project]
name = "build-agent-dev"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "deepagents>=0.7",
    "langchain",
    "langgraph",
    "langchain-deepseek",
    "langchain-openai",
    "pydantic-settings",
    "e2b>=2.59.0",
    "langfuse>=5.0.4",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]

[tool.ruff]
target-version = "py314"
line-length = 100
preview = true
lint.select = ["E", "F", "I", "UP", "B", "ANN", "PYI", "PGH003"]
lint.ignore = ["E501"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.uv]
# langgraph-api 0.16.x pins opentelemetry-exporter-prometheus<0.64 (OTel SDK ~1.42),
# while langfuse 5.x requires opentelemetry-sdk>=1.45.0. Override to the exporter
# release that matches SDK 1.45 so both can coexist.
override-dependencies = ["opentelemetry-exporter-prometheus>=0.66b1"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.37",
    "ruff==0.17.2",
    "ty==0.0.91",
]
