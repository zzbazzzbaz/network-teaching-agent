name: ghcr-cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  purge:
    name: 删除 GHCR 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 删除本项目全部 GHCR 版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="/repos/${{ github.repository }}/packages/container"
          for app in api agent web; do
            name="network-teaching-agent%2F${app}"
            ids=$(gh api "$base/$name/versions" --paginate -q '.[].id' || true)
            if [ -z "$ids" ]; then
              echo "skip $app: no versions"
              continue
            fi
            for id in $ids; do
              gh api -X DELETE "$base/$name/versions/$id"
              echo "deleted $app version $id"
            done
            gh api -X DELETE "$base/$name" && echo "deleted package $app" || echo "package $app kept (empty)"
          done
