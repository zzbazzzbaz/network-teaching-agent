# CI：push main 自动构建三个镜像并推到 GHCR（不在 CI 里跑测试；测试本地 `make test` / lint / build）
# 镜像 tag：sha-<40 位 commit>（回滚用）+ main（main 分支最新一次构建）；部署见 cd.yml（手动触发）
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 构建镜像 ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: apps/api
          - app: agent
            context: apps/agent
          - app: web
            context: apps/agent-ui
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
