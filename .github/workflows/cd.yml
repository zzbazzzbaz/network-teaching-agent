name: cd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "main 或 sha-<40 位 commit>"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  SITE_DOMAIN: network-agent.test.chatgqt.top
  DEPLOY_HOST: 101.35.223.219
  DEPLOY_USER: ubuntu
  DEPLOY_ROOT: /srv/network-teaching-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^(main|sha-[0-9a-f]{40})$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "missing DEPLOY_SSH_KEY"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          SCP="scp -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -rf '$DEPLOY_ROOT/nginx' '$DEPLOY_ROOT/scripts' '$DEPLOY_ROOT/docker-compose.yml'"
          $SCP -r deploy/nginx deploy/scripts deploy/docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"

          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_ROOT"
          chmod 755 scripts/*.sh
          chmod 644 nginx/*.conf docker-compose.yml
          [ -s .env ] || { echo "missing .env"; exit 1; }
          [ -f secrets/jwt/jwt_private.pem ] || { echo "missing secrets/jwt"; exit 1; }
          trap 'docker compose --env-file .env ps; docker compose --env-file .env logs --tail=80' ERR

          sudo -n "$(command -v nginx)" -t
          docker compose --env-file .env pull </dev/null
          docker compose --env-file .env up -d --wait postgres langgraph-pg langgraph-redis </dev/null
          docker compose --env-file .env run --rm --no-deps api alembic upgrade head </dev/null
          docker compose --env-file .env up -d --force-recreate --wait --no-deps web api reaper agent </dev/null
          docker compose --env-file .env up -d --remove-orphans --wait </dev/null
          sudo -n /usr/bin/systemctl reload nginx
          docker image prune -f >/dev/null
          docker compose --env-file .env ps
          REMOTE

      - name: Verify
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' "https://$SITE_DOMAIN/health" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          curl -fsS -m 15 "https://$SITE_DOMAIN/health"
          curl -fsS -o /dev/null -m 15 -w 'web %{http_code}\n' "https://$SITE_DOMAIN/"
          curl -fsS -o /dev/null -m 30 -w 'agent %{http_code}\n' "https://$SITE_DOMAIN/agent/ok"
          curl -fsS -o /dev/null -w 'ssl %{ssl_verify_result}\n' "https://$SITE_DOMAIN/health"
          curl -s -o /dev/null -m 15 -w 'http %{http_code}\n' "http://$SITE_DOMAIN/health"
